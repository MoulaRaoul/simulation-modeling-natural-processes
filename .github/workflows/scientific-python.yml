name: Scientific Python checks

on:
  push:
    paths:
      - "practicals/logistic_growth/**"
      - ".github/workflows/scientific-python.yml"
  pull_request:
    paths:
      - "practicals/logistic_growth/**"
      - ".github/workflows/scientific-python.yml"

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scientific numerical tests
        run: python -m unittest discover -s practicals/logistic_growth -p 'test_*.py' -v
      - name: Run convergence experiment
        run: python practicals/logistic_growth/convergence.py
